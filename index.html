:root{--bg:#fbf1e1;--ink:#2b1509;--muted:#6f503b;--accent:#b8501c;--gold:#8f5f0e;--glow:rgba(214,110,40,.35);--line:rgba(43,21,9,.22);
--serif:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;--sans:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160d08;--ink:#f6e7cf;--muted:#c9a98a;--accent:#f08a3c;--gold:#e3b96a;--glow:rgba(240,138,60,.28);--line:rgba(246,231,207,.25)}}
:root[data-theme="dark"]{--bg:#160d08;--ink:#f6e7cf;--muted:#c9a98a;--accent:#f08a3c;--gold:#e3b96a;--glow:rgba(240,138,60,.28);--line:rgba(246,231,207,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 40px;display:grid;gap:32px;align-items:center}
.poster{position:relative;justify-self:center;width:100%;max-width:440px}
.poster::before{content:"";position:absolute;inset:-12% -14%;background:radial-gradient(closest-side,var(--glow),transparent 72%);z-index:0}
.poster img{position:relative;z-index:1;display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.25;margin:0 0 14px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.date{font-family:var(--serif);font-weight:500;font-size:1.05rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 28px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.unit{padding:18px 4px 14px;text-align:center}
.unit+.unit{border-left:1px solid var(--line)}
.num{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,7vw,3.2rem);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums lining-nums}
.lab{display:block;margin-top:10px;font-family:var(--serif);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note{margin:22px 0 0;color:var(--muted);font-size:.95rem}
.done h1{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (min-width:860px){.wrap{grid-template-columns:minmax(300px,440px) 1fr;gap:64px;padding-top:48px}.poster{justify-self:start}}
</style>

function p(n){return n<10?"0"+n:""+n}
function tick(){
  var diff=target-Date.now();
  if(diff<=0){
    document.getElementById("app").classList.add("done");
    document.getElementById("title").textContent="Ramayana Part 1 is in cinemas now";
    el.d.textContent="0";el.h.textContent=el.m.textContent=el.s.textContent="00";
    clearInterval(t);return;
  }
  var sec=Math.floor(diff/1000);
  el.d.textContent=Math.floor(sec/86400);
  el.h.textContent=p(Math.floor(sec%86400/3600));
  el.m.textContent=p(Math.floor(sec%3600/60));
  el.s.textContent=p(sec%60);
}
var t=setInterval(tick,1000);tick();
</script>
</body>
</html>
